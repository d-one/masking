name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(fromJSON('["main", "dev"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Encode each path segment so characters like '#' or '?' cannot retarget the request.
          ref=$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')
          if ! gh api -X DELETE "repos/$REPO/git/refs/heads/$ref"; then
            # Succeed only if the branch is confirmed gone (404); surface any other failure.
            if out=$(gh api "repos/$REPO/branches/$ref" --silent 2>&1); then
              exit 1
            fi
            grep -q "HTTP 404" <<< "$out" || { echo "$out" >&2; exit 1; }
          fi
